<!DOCTYPE html>

<html>

<head>
  <title>Yondr: Plan</title>
  <meta charset="utf-8" />
  <meta name="description" content="A progressive web app to compare and contrast different job/relocation options" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7c0028" />
  <link rel="canonical" href="https://yondr.facerix.com/" />
  <meta property="og:title" content="Yondr: about" />
  <meta property="og:description" content="A progressive web app to compare and contrast different job/relocation options" />
  <meta property="og:url" content="https://yondr.facerix.com/" />
  <meta property="og:type" content="website" />

  <!-- <link rel="icon" href="/hero.svg" sizes="any" /> -->
  <link rel="icon" href="/icon512_maskable.png" type="image/png" />
  <link rel="mask-icon" href="/hero.svg" color="#ffffff" />
  <link rel="apple-touch-icon" href="/icon512_rounded.png" sizes="512x512" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/fonts/riesling/stylesheet.css" type="text/css" charset="utf-8">
  <link rel="stylesheet" href="/main.css" />

  <style>
    #main-head h1 {
      margin-right: auto;
      margin-left: 0.5em;
      padding-top: 6px;

      font-family: 'rieslingregular';
      font-weight: 400;
    }

    main {
      flex-direction: column;
      padding: 3em 15vw;

      line-height: 1.75rem;
      text-align: justify;

      gap: 2em;
    }

    h2 {
      margin: 0;
      font-family: 'rieslingregular', Arial, sans-serif;
      font-size: 3rem;
      text-align: center;
      color: #7c0028;
      font-weight: 400;
    }

    .timespan {
      display: flex;
      flex-direction: row;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 400;
      color: #7c0028;
    }

    #path-container {
      display: flex;
      flex-direction: column;
      gap: 1em;
    }
    .location-group { width: 100%; }
    .location-group h3 { color: #7c0028; margin: 0 0 0.5em; }
    .location-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 1em; }
    .add-here { margin-top: 0.75em; }
    .comparison-controls { display: flex; flex-wrap: wrap; gap: 1em; align-items: center; justify-content: center; }
    .comparison-controls label { display: flex; gap: 0.5em; align-items: center; }
    .comparison-hint { text-align: center; margin: 0; font-size: 0.9em; }

    #btnAdd {
      border: 1px dashed rgb(244, 12, 64);
      padding: 1em;
    }

    #no-options-message {
      text-align: center;
      display: none;
    }

    #path-container:empty + #no-options-message {
      display: block;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #7c0028;
      cursor: pointer;
      padding: 0.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      transition: opacity 0.2s ease;
    }

    .settings-btn:hover {
      opacity: 0.7;
    }

    .settings-btn svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>

<body class="fill-height watermark">
  <header id="main-head">
    <a href="/explore" class="home-logo">
      <img src="/hero.svg" width="64" alt="Yondr logo" />
    </a>
    <h1>YONDR</h1>
    <button id="btnSettings" class="settings-btn" title="User Settings" aria-label="Open user settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
      </svg>
    </button>
  </header>
  <main class="fill-height">
    <h2>Crossroad: <span id="crossroad-name"></span></h2>
    <div class="timespan">
      <span id="start-date"></span>&nbsp;&ndash;&nbsp;<span id="end-date"></span>
    </div>
    <div class="comparison-controls">
      <label>Salary ranges <select id="range-mode"><option value="off">Off</option><option value="median">Midpoint</option><option value="max">Maximum</option></select></label>
      <label>Living costs <select id="living-mode"><option value="relocate">Relocate</option><option value="commute">Commute</option></select></label>
    </div>
    <p class="comparison-hint" id="comparison-hint"></p>
    <div id="path-container"></div>
    <p id="no-options-message">You haven't added any options to this crossroad yet.<br/>Add one to get started!</p>
    <button id="btnAdd" class="btn">
      <img src="/images/pin-plus.svg" alt="add" />
      Add an Option
    </button>
  </main>  
  <edit-option-modal></edit-option-modal>
  <user-settings-modal></user-settings-modal>
</body>
<script src="plan.js" type="module"></script>
</html>
