<!DOCTYPE html>

<html>

<head>
  <title>Yondr: Plan</title>
  <meta charset="utf-8" />
  <meta name="description" content="A progressive web app to compare and contrast different job/relocation options" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7c0028" />
  <link rel="canonical" href="https://yondr.facerix.com/" />
  <meta property="og:title" content="Yondr: about" />
  <meta property="og:description" content="A progressive web app to compare and contrast different job/relocation options" />
  <meta property="og:url" content="https://yondr.facerix.com/" />
  <meta property="og:type" content="website" />

  <!-- <link rel="icon" href="/hero.svg" sizes="any" /> -->
  <link rel="icon" href="/icon512_maskable.png" type="image/png" />
  <link rel="mask-icon" href="/hero.svg" color="#ffffff" />
  <link rel="apple-touch-icon" href="/icon512_rounded.png" sizes="512x512" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/fonts/riesling/stylesheet.css" type="text/css" charset="utf-8">
  <link rel="stylesheet" href="/main.css" />

  <style>
    #main-head h1 {
      margin-right: auto;
      margin-left: 0.5em;
      padding-top: 6px;

      font-family: 'rieslingregular';
      font-weight: 400;
    }

    main {
      flex-direction: column;
      padding: 3em 2vw;

      line-height: 1.75rem;
      text-align: justify;

      gap: 2em;
    }

    h2 {
      margin: 0;
      font-family: 'rieslingregular', Arial, sans-serif;
      font-size: 3rem;
      text-align: center;
      color: #7c0028;
      font-weight: 400;
    }

    .timespan {
      display: flex;
      flex-direction: row;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 400;
      color: #7c0028;
    }

    .path-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 1.25em;
      text-align: left;
    }

    .all-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .comparison-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      justify-content: center;
      max-width: 40rem;
      margin: 0;
      padding: 0.25em 0.75em;
      background: #fff;
      border: 1px solid rgba(124, 0, 40, 0.15);
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(124, 0, 40, 0.08);
      text-align: left;
    }
    .control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35em;
    }
    .control-label {
      color: inherit;
      padding: 0;
      margin: 0 auto 0.35em;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input#show-current {
      accent-color: #7c0028;
      width: 1.75em;
      height: 1.75em;
      margin: 0;
    }
    .comparison-hint {
      text-align: center;
      margin: 0;
      font-size: 0.9em;
      color: rgba(48, 48, 48, 0.8);
    }

    #btnAdd {
      align-self: center;
      border: 1px dashed rgb(244, 12, 64);
      padding: 1em 1.5em;
    }

    @media (max-width: 640px) {
      main {
        padding: 2em 1rem;
      }
      h2 {
        font-size: 2.25rem;
      }
    }

    #no-options-message {
      text-align: center;
    }

    #paths-region {
      display: flex;
      flex-direction: column;
      gap: 3em;
    }

    #closed-section[hidden] {
      display: none;
    }

    #closed-section h3 {
      margin: 0 0 0.75em;
      padding-top: 1.5em;
      border-top: 1px solid rgba(124, 0, 40, 0.15);
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: center;
      color: rgba(48, 48, 48, 0.8);
    }

    .settings-btn {
      background: none;
      border: none;
      color: #7c0028;
      cursor: pointer;
      padding: 0.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      transition: opacity 0.2s ease;
    }

    .settings-btn:hover {
      opacity: 0.7;
    }

    .settings-btn svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>

<body class="fill-height watermark">
  <header id="main-head">
    <a href="/explore" class="home-logo">
      <img src="/hero.svg" width="64" alt="Yondr logo" />
    </a>
    <h1>YONDR</h1>
    <button id="btnSettings" class="settings-btn" title="User Settings" aria-label="Open user settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
      </svg>
    </button>
  </header>
  <main class="fill-height">
    <h2>Crossroad: <span id="crossroad-name"></span></h2>
    <div class="timespan">
      <span id="start-date"></span>&nbsp;&ndash;&nbsp;<span id="end-date"></span>
    </div>
    <div class="all-controls">
      <div class="comparison-controls">
        <label class="control"><span class="control-label">Include current</span><input id="show-current" type="checkbox" checked /></label>

        <radio-group id="range-mode" label="Salaries">
          <radio-option value="off" checked label="Only count concrete base">
            <img src="/images/fixed.svg" alt="" />
          </radio-option>
          <radio-option value="median" label="Use range midpoint">
            <img src="/images/midpoint.svg" alt="" />
          </radio-option>
          <radio-option value="max" label="Use range maximum">
            <img src="/images/maximum.svg" alt="" />
          </radio-option>
        </radio-group>

        <radio-group id="living-mode" label="Living costs">
          <radio-option value="relocate" checked label="Relocate">
            <img src="/images/relocate.svg" alt="Relocate" />
          </radio-option>
          <radio-option value="commute" label="Commute">
            <img src="/images/commute.svg" alt="Commute" />
          </radio-option>
        </radio-group>
      </div>
      <button id="btnAdd" class="btn">
        <img src="/images/pin-plus.svg" alt="add" />
        Add an Option
      </button>
    </div>
    <p class="comparison-hint u-hidden" id="comparison-hint"></p>
    <p id="no-options-message" hidden>You haven't added any options to this crossroad yet.<br/>Add one to get started!</p>
    <div id="paths-region">
      <div id="path-container" class="path-grid"></div>
      <section id="closed-section" hidden aria-labelledby="closed-heading">
        <h3 id="closed-heading">Rejected &amp; withdrawn</h3>
        <div id="closed-path-container" class="path-grid"></div>
      </section>
    </div>
  </main>  
  <edit-option-modal></edit-option-modal>
  <user-settings-modal></user-settings-modal>
</body>
<script src="plan.js" type="module"></script>
</html>
